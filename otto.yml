version: 1

defaults:
  timeout: "2m" # max runtime per attempt
  retries: 0 # retries after first failure
  retry_backoff: "1s"
  notify_on: always

notifications:
  desktop: true

tasks:
  build:
    description: Build app
    exec: ["pnpm", "next", "dev"]

  start:
    description: Start app
    exec: ["pnpm", "next", "dev"]

  dev:
    description: Run app in development
    exec: ["pnpm", "next", "dev"]

  lint:
    description: Run Eslint on the app, see `eslint.config.mjs`
    exec: ["pnpm", "eslint"]

  typecheck:
    description: Run Typecheck on the app
    exec: ["tsc", "--noEmit"]

  test:
    description: Run vitest
    exec: ["pnpm", "vitest", "run"]

  test_watch:
    description: Run vitest in watch mode
    exec: ["pnpm", "vitest"]

  test_ui:
    description: Run vitest with ui
    exec: ["pnpm", "vitest", "--ui"]

  test_coverage:
    description: Run vitest coverage
    exec: ["pnpm", "vitest", "--coverage"]

  check:
    description: Run testing, typecheck and lint on the app
    tasks: ["test", "typecheck", "lint"]
    parallel: true

  clean:
    run: "rm -rf ./target"
